name: wpmgrh18

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: wpmgr
      POSTGRES_PASSWORD: wpmgr
      POSTGRES_DB: wpmgr
      WPMGR_DB_APP_USER: wpmgr_app
      WPMGR_DB_APP_PASSWORD: wpmgr-app-dev-secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-18212}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpmgr -d wpmgr"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: "no"
    command: ["redis-server", "--save", "", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-18213}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  dex:
    image: dexidp/dex:v2.41.1
    restart: "no"
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro
      - dex-data:/var/dex
    ports:
      - "127.0.0.1:${DEX_HOST_PORT:-18214}:5556"

  api:
    image: wpmgr-lab:v0.61.199
    restart: "no"
    environment:
      WPMGR_ENV: development
      WPMGR_HTTP_ADDR: ":8080"
      WPMGR_LOG_LEVEL: info
      WPMGR_DB_HOST: postgres
      WPMGR_DB_PORT: "5432"
      WPMGR_DB_USER: wpmgr_app
      WPMGR_DB_PASSWORD: wpmgr-app-dev-secret
      WPMGR_DB_NAME: wpmgr
      WPMGR_DB_SSLMODE: disable
      WPMGR_DB_MIGRATION_DSN: postgres://wpmgr:wpmgr@postgres:5432/wpmgr?sslmode=disable
      WPMGR_ALLOW_RLS_BYPASS_ROLE: "false"
      WPMGR_REDIS_ADDR: redis:6379
      WPMGR_SESSION_SECRET: h18-dex-default-session-secret-32bytes-min
      WPMGR_BOOTSTRAP_CLAIM_SECRET: h18-bootstrap-claim-secret-value-ok
      WPMGR_AUTH_PROXY_HOPS: "1"
      WPMGR_OIDC_ISSUER: http://dex:5556/dex
      WPMGR_OIDC_CLIENT_ID: wpmgr
      WPMGR_OIDC_CLIENT_SECRET: wpmgr-oidc-dev-secret
      WPMGR_OIDC_REDIRECT_URL: http://127.0.0.1:${WEB_HOST_PORT:-18210}/auth/oidc/callback
      WPMGR_PUBLIC_BASE_URL: http://127.0.0.1:${WEB_HOST_PORT:-18210}
      WPMGR_S3_BUCKET: ""
      WPMGR_CLICKHOUSE_ADDR: ""
      WPMGR_OTEL_EXPORTER_OTLP_ENDPOINT: ""
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18211}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dex:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    restart: "no"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18210}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  dex-data:
